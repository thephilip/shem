[build-system]
requires = ["setuptools>=67"]
build-backend = "setuptools.build_meta"

[project]
name = "shem-py"
version = "0.1.0"
description = "Python SDK for Shem agent orchestration"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
