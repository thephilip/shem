name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "29.3"

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: |
            deps/
            _build/prod/lib/
          key: ${{ runner.os }}-mix-prod-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get --only prod

      - name: Compile dependencies
        run: mix deps.compile

      - name: Build release
        run: MIX_ENV=prod mix release

      - name: Package
        run: |
          cd _build/prod/rel
          tar -czf shem-linux-x86_64.tar.gz shem/

      - uses: actions/upload-artifact@v4
        with:
          name: shem-linux-x86_64
          path: _build/prod/rel/shem-linux-x86_64.tar.gz

  build-macos-intel:
    name: Build macOS x86_64
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "29.3"

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: |
            deps/
            _build/prod/lib/
          key: ${{ runner.os }}-mix-prod-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get --only prod

      - name: Compile dependencies
        run: mix deps.compile

      - name: Build release
        run: MIX_ENV=prod mix release

      - name: Package
        run: |
          cd _build/prod/rel
          tar -czf shem-macos-x86_64.tar.gz shem/

      - uses: actions/upload-artifact@v4
        with:
          name: shem-macos-x86_64
          path: _build/prod/rel/shem-macos-x86_64.tar.gz

  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "29.3"

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: |
            deps/
            _build/prod/lib/
          key: ${{ runner.os }}-mix-prod-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get --only prod

      - name: Compile dependencies
        run: mix deps.compile

      - name: Build release
        run: MIX_ENV=prod mix release

      - name: Package
        run: |
          cd _build/prod/rel
          tar -czf shem-macos-arm64.tar.gz shem/

      - uses: actions/upload-artifact@v4
        with:
          name: shem-macos-arm64
          path: _build/prod/rel/shem-macos-arm64.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-linux, build-macos-intel, build-macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shem-linux-x86_64

      - uses: actions/download-artifact@v4
        with:
          name: shem-macos-x86_64

      - uses: actions/download-artifact@v4
        with:
          name: shem-macos-arm64

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" \
            shem-linux-x86_64.tar.gz \
            shem-macos-x86_64.tar.gz \
            shem-macos-arm64.tar.gz \
            --title "Shem ${{ github.ref_name }}" \
            --generate-notes
