name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28"

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: |
            deps/
            _build/prod/lib/
          key: ${{ runner.os }}-mix-prod-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get --only prod

      - name: Compile dependencies
        run: mix deps.compile

      - name: Build release
        run: MIX_ENV=prod mix release

      # The crypto NIF is dynamically linked against the builder's OpenSSL; hosts
      # with a different/patched libcrypto (e.g. Fedora, which drops SM4) fail to
      # boot (#1). Vendor the builder's libcrypto and point only the crypto NIFs
      # at it via rpath — LD_LIBRARY_PATH would leak into spawned tool runtimes.
      - name: Vendor libcrypto for the crypto NIF
        run: |
          sudo apt-get update -q && sudo apt-get install -yq patchelf
          cd _build/prod/rel
          crypto_so=$(ls shem/lib/crypto-*/priv/lib/crypto.so)
          libcrypto=$(ldd "$crypto_so" | awk '/libcrypto\.so\.3/ {print $3}')
          mkdir -p shem/vendor/lib
          cp "$libcrypto" shem/vendor/lib/
          for so in shem/lib/crypto-*/priv/lib/*.so; do
            patchelf --set-rpath '$ORIGIN/../../../../vendor/lib' "$so"
          done

      - name: Verify crypto boots on Fedora (issue #1 repro)
        run: |
          docker run --rm -v "$PWD/_build/prod/rel/shem:/shem:ro" \
            -e RELEASE_TMP=/tmp registry.fedoraproject.org/fedora:44 \
            /shem/bin/shem eval '{:ok, _} = Application.ensure_all_started(:crypto); IO.inspect(:crypto.hash(:sha256, "shem"))'

      # The tarball bundles ERTS + Elixir ebins but not the `elixir` CLI. Prove
      # run_code works with neither a container runtime nor a system Elixir on
      # PATH — a fresh Fedora with elixir stripped (Phase 6 regression guard).
      - name: Verify run_code works without a system Elixir
        run: |
          docker run --rm -v "$PWD/_build/prod/rel/shem:/shem:ro" \
            -e RELEASE_TMP=/tmp -e PATH=/usr/bin:/bin \
            registry.fedoraproject.org/fedora:44 \
            /shem/bin/shem eval '{exe, pre} = Shem.Lab.Languages.host_elixir(); true = String.contains?(exe, "erl"); d = Path.join(System.tmp_dir!(), "rc"); File.mkdir_p!(d); File.write!(Path.join(d, "r.exs"), "IO.write(\"__SHEM_RESULT__\" <> inspect(2*21))"); {out, 0} = System.cmd(exe, pre ++ ["r.exs"], cd: d, stderr_to_stdout: true); true = String.contains?(out, "__SHEM_RESULT__42"); IO.puts("ok")'

      - name: Package
        run: |
          cd _build/prod/rel
          tar -czf shem-linux-x86_64.tar.gz shem/

      - uses: actions/upload-artifact@v4
        with:
          name: shem-linux-x86_64
          path: _build/prod/rel/shem-linux-x86_64.tar.gz

  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28"

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: |
            deps/
            _build/prod/lib/
          key: ${{ runner.os }}-mix-prod-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get --only prod

      - name: Compile dependencies
        run: mix deps.compile

      - name: Build release
        run: MIX_ENV=prod mix release

      - name: Package
        run: |
          cd _build/prod/rel
          tar -czf shem-macos-arm64.tar.gz shem/

      - uses: actions/upload-artifact@v4
        with:
          name: shem-macos-arm64
          path: _build/prod/rel/shem-macos-arm64.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-linux, build-macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shem-linux-x86_64

      - uses: actions/download-artifact@v4
        with:
          name: shem-macos-arm64

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" \
            shem-linux-x86_64.tar.gz \
            shem-macos-arm64.tar.gz \
            --title "Shem ${{ github.ref_name }}" \
            --generate-notes
